<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusa Translate</title>
    <link rel="icon" type="image/png" href="assets/mini-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <img src="assets/nusa-translate-logo.png" alt="Nusa Translate Logo" class="brand-logo">
        </div>
    </header>

    <main class="translator-wrapper">
        <div class="translator-container">
            <!-- Panel Bahasa Asal -->
            <div class="panel">
                <div class="controls">
                    <select id="source-lang">
                        <option value="id" selected>Bahasa Indonesia</option>
                        <option value="jv">Bahasa Jawa</option>
                        <option value="su">Bahasa Sunda</option>
                        <option value="mad">Bahasa Madura</option>
                        <option value="min">Bahasa Minangkabau</option>
                        <option value="bug">Bahasa Bugis</option>
                        <option value="ban">Bahasa Bali</option>
                        <option value="bjn">Bahasa Banjar</option>
                        <option value="ace">Bahasa Aceh</option>
                        <option value="bbc">Bahasa Batak Toba</option>
                        <option value="mak">Bahasa Makassar</option>
                        <option value="sas">Bahasa Sasak</option>
                        <option value="btx">Bahasa Batak Karo</option>
                        <option value="nia">Bahasa Nias</option>
                        <option value="btm">Bahasa Mandailing</option>
                        <option value="sda">Bahasa Toraja</option>
                        <option value="day">Bahasa Dayak</option>
                        <option value="jax">Bahasa Melayu Jambi</option>
                        <option value="mui">Bahasa Musi</option>
                        <option value="gor">Bahasa Gorontalo</option>
                    </select>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="source-text" placeholder="Ketik atau ucapkan teks di sini..."></textarea>
                    <div class="action-buttons">
                        <button id="source-speak-btn" class="icon-btn hidden" aria-label="Bacakan Teks">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                        </button>
                        <button id="mic-btn" class="icon-btn" aria-label="Input Suara">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tombol Tukar Bahasa -->
            <button id="swap-btn" class="swap-btn" aria-label="Tukar Bahasa">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3l4 4-4 4"></path>
                    <path d="M3 7h18"></path>
                    <path d="M7 21l-4-4 4-4"></path>
                    <path d="M21 17H3"></path>
                </svg>
            </button>

            <!-- Panel Bahasa Tujuan -->
            <div class="panel">
                <div class="controls">
                    <select id="target-lang">
                        <option value="id">Bahasa Indonesia</option>
                        <option value="jv" selected>Bahasa Jawa</option>
                        <option value="su">Bahasa Sunda</option>
                        <option value="mad">Bahasa Madura</option>
                        <option value="min">Bahasa Minangkabau</option>
                        <option value="bug">Bahasa Bugis</option>
                        <option value="ban">Bahasa Bali</option>
                        <option value="bjn">Bahasa Banjar</option>
                        <option value="ace">Bahasa Aceh</option>
                        <option value="bbc">Bahasa Batak Toba</option>
                        <option value="mak">Bahasa Makassar</option>
                        <option value="sas">Bahasa Sasak</option>
                        <option value="btx">Bahasa Batak Karo</option>
                        <option value="nia">Bahasa Nias</option>
                        <option value="btm">Bahasa Mandailing</option>
                        <option value="sda">Bahasa Toraja</option>
                        <option value="day">Bahasa Dayak</option>
                        <option value="jax">Bahasa Melayu Jambi</option>
                        <option value="mui">Bahasa Musi</option>
                        <option value="gor">Bahasa Gorontalo</option>
                    </select>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="target-text" readonly></textarea>
                    <div class="action-buttons">
                        <button id="target-speak-btn" class="icon-btn hidden" aria-label="Bacakan Teks">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Riwayat (History) -->
        <div class="history-container">
            <div class="history-header" id="history-toggle">
                <h3>Riwayat Terjemahan</h3>
                <svg id="history-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="history-content hidden" id="history-content">
                <ul id="history-list">
                    <li class="empty-history">Belum ada riwayat. Ketik sesuatu untuk mulai menerjemahkan.</li>
                </ul>
            </div>
        </div>
    </main>

    <!-- Pastikan kedua baris ini ada agar website berfungsi -->
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>
</html>
